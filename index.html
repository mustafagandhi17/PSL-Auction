    function calculatePriorityGaps(roster) {
      const wk = roster.filter(r => r.role === "Wicket-keeper").length;
      const batters = roster.filter(r => r.role === "Top-Order Batter").length;
      const allRounders = roster.filter(r => r.role === "All-Rounder").length;
      const pace = roster.filter(r => r.role === "Fast Bowler").length;
      const spin = roster.filter(r => r.role === "Spinner").length;

      const gaps = [];
      if (wk === 0) gaps.push({ text: "URGENT: Wicket-keeper", priority: 1 });
      if (pace < 3) gaps.push({ text: `Pace Bowlers (${pace}/3)`, priority: 2 });
      if (batters < 4) gaps.push({ text: `Top-Order Batters (${batters}/4)`, priority: 3 });
      if (spin < 2) gaps.push({ text: `Spinners (${spin}/2)`, priority: 4 });
      if (allRounders < 2) gaps.push({ text: `All-Rounders (${allRounders}/2)`, priority: 5 });

      if (gaps.length === 0) return [{ text: "Roster Well Balanced", priority: 99 }];
      return gaps.slice(0, 3);
    }

        color = "text-cyan-400";
        reasoning = `${rival.name} has only PKR ${rival.remPurse.toFixed(2)} Cr remaining and cannot match your bid of PKR ${bidVal.toFixed(2)} Cr!`;

        verdict = "PUSH RIVAL TO MAX";
        color = "text-amber-400";
        reasoning = `${rival.name} max bid ceiling is PKR ${rival.maxBidPower.toFixed(2)} Cr. Bid one more tick (+0.25 Cr) to force them to forfeit.`;
      } else if (myTeam.remPurse < bidVal + 0.5) {
        verdict = "LET THEM OVERPAY";
        color = "text-rose-400";
        reasoning = `Your remaining purse (PKR ${myTeam.remPurse.toFixed(2)} Cr) is constrained. Don't engage in a bidding war here.`;
      } else {
        verdict = "BID FAST & AGGRESSIVE";
        color = "text-emerald-400";
        reasoning = `${rival.name} urgently needs a ${state.aiTargetRole}. Counter-bid up to PKR ${cap.toFixed(2)} Cr to secure the asset.`;
      }

      state.aiAdvice = { verdict, color, cap: cap.toFixed(2), rivalPurse: rival.remPurse.toFixed(2), reasoning };
      render();
    }

    function computeStats() {
      const stats = {};
      DEFAULT_TEAMS.forEach(t => {
        stats[t.id] = {
          ...t, spent: 0, count: 0, overseas: 0, roster: [],
          roles: { "Wicket-keeper": 0, "Top-Order Batter": 0, "All-Rounder": 0, "Fast Bowler": 0, "Spinner": 0 }
        };
      });

      state.sales.forEach(s => {
        if (stats[s.teamId]) {
          stats[s.teamId].spent += Number(s.price);
          stats[s.teamId].count += 1;
          if (s.isOverseas) stats[s.teamId].overseas += 1;
          stats[s.teamId].roster.push(s);
          if (stats[s.teamId].roles[s.role] !== undefined) {
            stats[s.teamId].roles[s.role] += 1;
          }
        }
      });

      Object.keys(stats).forEach(id => {
        const t = stats[id];
        t.remPurse = Math.max(0, t.purseCap - t.spent);
        const unfilledSlots = Math.max(0, 16 - t.count);
        t.maxBidPower = Math.max(0, t.remPurse - (unfilledSlots * 0.50));
        t.priorityGaps = calculatePriorityGaps(t.roster);
      });

      return stats;
    }

    function handleAddSale(teamId) {
      if (!state.pName.trim()) return;
      let parsedPrice = parseFloat(state.pPrice) || 0.6;
      if (parsedPrice > 1000) parsedPrice = parsedPrice / 10000000;

      const newSale = {
        id: Date.now(),
        name: state.pName.trim(),
        role: state.pRole,
        isOverseas: state.pOverseas,
        price: parsedPrice,
        teamId: teamId || state.pTeam
      };

      state.sales = [newSale, ...state.sales];
      state.pName = "";
      state.pPrice = "";
      saveState();
      render();
    }

    function render() {
      const root = document.getElementById("root");
      if (!state.authenticated) {
        root.innerHTML = `
          <div class="fixed inset-0 z-[100] bg-[#080c14] flex items-center justify-center p-4">
            <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-6 max-w-xs w-full shadow-2xl text-center">
              <div class="w-12 h-12 bg-emerald-500/20 border border-emerald-500/50 rounded-xl flex items-center justify-center text-2xl mx-auto mb-3">🔒</div>
              <h2 class="text-base font-black text-white uppercase tracking-wider mb-1">PSL AUCTION HUB</h2>
              <p class="text-xs text-slate-400 mb-4">Enter team passcode to view auction telemetry</p>
              <form id="passForm" class="space-y-3">
                <input id="passInput" type="password" placeholder="Passcode..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-emerald-500" />
                ${state.error ? '<p class="text-xs font-bold text-rose-400">Incorrect Passcode!</p>' : ''}
                <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs uppercase tracking-wider shadow-lg">Unlock Dashboard</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById("passForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const val = document.getElementById("passInput").value;
          if (val.trim() === DASHBOARD_PASSCODE) {
            state.authenticated = true;
            saveState();
            render();
          } else {
            state.error = true;
            render();
          }
        });
        return;
      }

      const stats = computeStats();
      const myTeam = stats[state.myTeamId];
      const selectedSquad = stats[state.selectedSquadTeamId];

      root.innerHTML = `
        <div class="min-h-screen flex flex-col pb-12">
          <!-- TOP HEADER -->
          <header class="bg-[#0b1120] border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-xl">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center font-black text-emerald-400 text-lg">⚡</div>
                <div>
                  <h1 class="text-lg font-black text-white flex items-center gap-2">PSL AUCTION COMMAND CENTER</h1>
                  <p class="text-xs text-slate-400">100ms Scannable Intelligence & Telemetry Hub</p>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1">
                  <span class="text-xs font-bold text-slate-400 uppercase">My Team:</span>
                  <select id="myTeamSelect" class="bg-transparent text-sm font-extrabold text-emerald-400 focus:outline-none cursor-pointer">
                    ${DEFAULT_TEAMS.map(t => `<option value="${t.id}" ${t.id === state.myTeamId ? 'selected' : ''} class="bg-slate-900 text-white">${t.name} (${t.short})</option>`).join('')}
                  </select>
                </div>
                <button id="lockBtn" class="px-2.5 py-1.5 bg-rose-500/10 border border-rose-500/40 rounded-lg text-xs font-bold text-rose-400 hover:bg-rose-500/20">🔒 Lock</button>
              </div>
            </div>
          </header>

          <main class="max-w-7xl mx-auto w-full px-4 pt-4 space-y-4 flex-1">
            <!-- RAPID INPUT BAR -->
            <div class="command-card rounded-xl p-3 border-l-4 border-l-emerald-500 shadow-lg">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-black uppercase text-emerald-400 tracking-wider flex items-center gap-1">⚡ Rapid Auction Sale Input</span>
                <button id="undoBtn" class="text-xs font-bold px-2 py-1 rounded bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20">↩ Undo Last Sale</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-12 gap-2">
                <input id="pNameInput" type="text" placeholder="Player Name" value="${state.pName}" class="md:col-span-3 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
                <select id="pRoleSelect" class="md:col-span-2 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-xs font-bold text-slate-200 focus:outline-none">
                  <option value="Top-Order Batter" ${state.pRole === "Top-Order Batter" ? 'selected' : ''}>Top-Order Batter</option>
                  <option value="Wicket-keeper" ${state.pRole === "Wicket-keeper" ? 'selected' : ''}>Wicket-keeper</option>
                  <option value="All-Rounder" ${state.pRole === "All-Rounder" ? 'selected' : ''}>All-Rounder</option>
                  <option value="Fast Bowler" ${state.pRole === "Fast Bowler" ? 'selected' : ''}>Fast Bowler</option>
                  <option value="Spinner" ${state.pRole === "Spinner" ? 'selected' : ''}>Spinner</option>
                </select>
                <input id="pPriceInput" type="number" step="0.05" placeholder="Price (Cr)" value="${state.pPrice}" class="md:col-span-2 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white mono font-bold focus:outline-none" />
                <button id="pOverseasBtn" type="button" class="md:col-span-2 py-2 px-2 rounded-lg border text-xs font-extrabold ${state.pOverseas ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-900 border-slate-700 text-slate-400'}">
                  ${state.pOverseas ? "✈️ Overseas" : "🇵🇰 Local"}
                </button>
                <div class="md:col-span-3 grid grid-cols-4 gap-1">
                  ${DEFAULT_TEAMS.map(t => `<button class="quick-add-btn py-1.5 px-1 rounded bg-slate-800 hover:bg-emerald-600 hover:text-black border border-slate-700 text-[11px] font-extrabold text-slate-200 transition" data-team="${t.id}">${t.short}</button>`).join('')}
                </div>
              </div>
            </div>

            <!-- MY TEAM HUD -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
              <div class="command-card rounded-xl p-4 border-l-4 border-l-emerald-500">
                <span class="text-xs font-bold text-slate-400 uppercase">Remaining Purse</span>
                <div class="text-3xl font-black text-emerald-400 mono mt-1">PKR ${myTeam.remPurse.toFixed(2)} Cr</div>
                <div class="text-[11px] text-slate-400 mt-1 flex justify-between"><span>Spent: PKR ${myTeam.spent.toFixed(2)} Cr</span><span>Cap: PKR ${myTeam.purseCap.toFixed(1)} Cr</span></div>
              </div>
              <div class="command-card rounded-xl p-4 border-l-4 border-l-cyan-500">
                <span class="text-xs font-bold text-slate-400 uppercase">Max Bidding Power</span>
                <div class="text-3xl font-black text-cyan-400 mono mt-1">PKR ${myTeam.maxBidPower.toFixed(2)} Cr</div>
                <div class="text-[11px] text-slate-400 mt-1">Reserve Slot Capital: PKR ${((Math.max(0, 16 - myTeam.count)) * 0.50).toFixed(2)} Cr</div>
              </div>
              <div class="command-card rounded-xl p-4 border-l-4 border-l-amber-500">
                <span class="text-xs font-bold text-slate-400 uppercase">Squad Capacity</span>
                <div class="text-3xl font-black text-amber-400 mono mt-1">${myTeam.count} <span class="text-lg text-slate-400 font-extrabold">/ 20</span></div>
                <div class="text-[11px] text-slate-400 mt-1">Overseas: <span class="font-extrabold text-amber-300">${myTeam.overseas} / 6 ✈️</span></div>
              </div>
              <div class="command-card rounded-xl p-4 border-l-4 border-l-purple-500">
                <span class="text-xs font-bold text-slate-400 uppercase">Role Composition</span>
                <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-xs mt-2 font-bold">
                  <div class="flex justify-between border-b border-slate-800 pb-0.5"><span class="text-slate-400">WK:</span><span class="${myTeam.roles["Wicket-keeper"] > 0 ? "text-emerald-400" : "text-rose-400 font-black"}">${myTeam.roles["Wicket-keeper"]}</span></div>
                  <div class="flex justify-between border-b border-slate-800 pb-0.5"><span class="text-slate-400">Batters:</span><span>${myTeam.roles["Top-Order Batter"]}</span></div>
                  <div class="flex justify-between border-b border-slate-800 pb-0.5"><span class="text-slate-400">All-Rnd:</span><span>${myTeam.roles["All-Rounder"]}</span></div>
                  <div class="flex justify-between border-b border-slate-800 pb-0.5"><span class="text-slate-400">Pace:</span><span>${myTeam.roles["Fast Bowler"]}</span></div>
                </div>
              </div>
            </div>

            <!-- ALL 8 TEAMS PRIORITY GAP MATRIX -->
            <div class="command-card rounded-xl p-4">
              <h2 class="text-sm font-black uppercase text-white mb-3 flex items-center gap-2"><span>🎯</span> Rival Franchise Threat & Priority Gap Matrix</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                ${DEFAULT_TEAMS.map(t => {
                  const stat = stats[t.id];
                  const isMy = t.id === state.myTeamId;
                  return `
                    <div class="rounded-lg p-3 border ${isMy ? 'bg-emerald-950/20 border-emerald-500/60' : 'bg-slate-900/80 border-slate-800'}">
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-black px-2 py-0.5 rounded border ${t.bgClass}">${t.name} (${t.short})</span>
                        ${isMy ? '<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-emerald-500 text-black">MY TEAM</span>' : ''}
                      </div>
                      <div class="grid grid-cols-2 gap-2 text-xs mb-2">
                        <div class="bg-slate-950 p-1.5 rounded border border-slate-800"><span class="text-[9px] text-slate-500 block">PURSE</span><span class="font-black text-emerald-400 mono">PKR ${stat.remPurse.toFixed(2)}</span></div>
                        <div class="bg-slate-950 p-1.5 rounded border border-slate-800"><span class="text-[9px] text-slate-500 block">MAX BID</span><span class="font-black text-cyan-400 mono">PKR ${stat.maxBidPower.toFixed(2)}</span></div>
                      </div>
                      <div class="space-y-1 pt-1 border-t border-slate-800">
                        <span class="text-[10px] font-extrabold text-slate-400 uppercase block">Priority Gaps:</span>
                        ${stat.priorityGaps.map((g, gi) => `
                          <div class="text-[10px] font-bold px-2 py-0.5 rounded ${g.priority === 1 ? 'bg-rose-500/10 text-rose-400 border border-rose-500/30' : 'bg-slate-800 text-slate-300'}">#${gi + 1} ${g.text}</div>
                        `).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- GEMINI AI STRATEGY ADVISOR -->
            <div class="command-card rounded-xl p-4 border-l-4 border-l-cyan-500">
              <h2 class="text-sm font-black uppercase text-white mb-2 flex items-center gap-2"><span>🤖</span> Gemini AI Bidding Strategy Advisor</h2>
              <div class="grid grid-cols-1 md:grid-cols-5 gap-2 mb-3">
                <input id="aiPlayer" type="text" placeholder="Target Player Name" value="${state.aiTargetPlayer}" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                <select id="aiRole" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-xs font-bold text-slate-200">
                  <option value="Wicket-keeper" ${state.aiTargetRole === "Wicket-keeper" ? 'selected' : ''}>Wicket-keeper</option>
                  <option value="Top-Order Batter" ${state.aiTargetRole === "Top-Order Batter" ? 'selected' : ''}>Top-Order Batter</option>
                  <option value="All-Rounder" ${state.aiTargetRole === "All-Rounder" ? 'selected' : ''}>All-Rounder</option>
                  <option value="Fast Bowler" ${state.aiTargetRole === "Fast Bowler" ? 'selected' : ''}>Fast Bowler</option>
                  <option value="Spinner" ${state.aiTargetRole === "Spinner" ? 'selected' : ''}>Spinner</option>
                </select>
                <input id="aiBid" type="number" step="0.25" placeholder="Active Bid (Cr)" value="${state.aiCurrentBid}" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white mono font-bold" />
                <select id="aiRival" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-xs font-bold text-amber-300">
                  ${DEFAULT_TEAMS.filter(t => t.id !== state.myTeamId).map(t => `<option value="${t.id}" ${t.id === state.aiRivalTeam ? 'selected' : ''}>Rival: ${t.name}</option>`).join('')}
                </select>
                <button id="runAiBtn" class="bg-cyan-600 hover:bg-cyan-500 text-black font-black text-xs rounded-lg px-3 py-2 uppercase">⚡ Run AI Telemetry</button>
              </div>

              ${state.aiAdvice ? `
                <div class="bg-slate-950 border border-cyan-500/40 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase block">Recommended Action:</span>
                    <span class="text-lg font-black tracking-wide ${state.aiAdvice.color}">${state.aiAdvice.verdict}</span>
                    <p class="text-xs text-slate-300 mt-0.5">${state.aiAdvice.reasoning}</p>
                  </div>
                  <div class="flex gap-4 border-l border-slate-800 pl-4 text-xs">
                    <div><span class="text-[9px] text-slate-500 block">TARGET CAP</span><span class="font-extrabold text-emerald-400 mono">PKR ${state.aiAdvice.cap} Cr</span></div>
                    <div><span class="text-[9px] text-slate-500 block">RIVAL PURSE</span><span class="font-extrabold text-amber-400 mono">PKR ${state.aiAdvice.rivalPurse} Cr</span></div>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- ALL 8 SQUADS ROSTER TABLE -->
            <div class="command-card rounded-xl p-4">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h2 class="text-sm font-black uppercase text-white flex items-center gap-2"><span>📋</span> All 8 Franchises Squad Roster Inspector</h2>
                <div class="flex flex-wrap gap-1">
                  ${DEFAULT_TEAMS.map(t => `<button class="squad-tab-btn px-2.5 py-1 rounded text-xs font-extrabold ${t.id === state.selectedSquadTeamId ? 'bg-emerald-500 text-black' : 'bg-slate-800 text-slate-300'}" data-team="${t.id}">${t.short} (${stats[t.id].count})</button>`).join('')}
                </div>
              </div>

              <div class="bg-slate-950 border border-slate-800 rounded-lg overflow-x-auto">
                <div class="p-3 bg-slate-900 flex items-center justify-between border-b border-slate-800">
                  <span class="text-xs font-black text-emerald-400 uppercase">${selectedSquad.name} Squad Roster (${selectedSquad.count} Players)</span>
                  <span class="text-xs font-bold text-slate-400">Total Spent: PKR ${selectedSquad.spent.toFixed(2)} Cr</span>
                </div>
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="bg-slate-900/60 text-slate-400 border-b border-slate-800 font-bold uppercase">
                      <th class="p-2">#</th>
                      <th class="p-2">Player Name</th>
                      <th class="p-2">Role</th>
                      <th class="p-2">Category</th>
                      <th class="p-2 text-right">Price (PKR)</th>
                      <th class="p-2 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${selectedSquad.roster.map((player, idx) => `
                      <tr class="border-b border-slate-800/60 hover:bg-slate-900/40 text-slate-200">
                        <td class="p-2 text-slate-500 mono">${idx + 1}</td>
                        <td class="p-2 font-bold text-white flex items-center gap-1">
                          ${player.name}
                          ${player.isOverseas ? '<span class="text-[9px] text-amber-300 bg-amber-500/10 px-1 rounded">✈️ Foreign</span>' : ''}
                        </td>
                        <td class="p-2 text-slate-400">${player.role}</td>
                        <td class="p-2"><span class="px-1.5 py-0.5 rounded bg-slate-800 text-[10px]">${player.isOverseas ? "Overseas" : "Local"}</span></td>
                        <td class="p-2 text-right font-black text-emerald-400 mono">PKR ${Number(player.price).toFixed(2)} Cr</td>
                        <td class="p-2 text-center">
                          <button class="delete-btn text-rose-400 font-bold px-1.5 py-0.5 rounded bg-rose-500/10 hover:bg-rose-500/20" data-id="${player.id}">✕</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </main>
        </div>
      `;

      // Event Listeners
      document.getElementById("myTeamSelect").addEventListener("change", (e) => { state.myTeamId = e.target.value; render(); });
      document.getElementById("lockBtn").addEventListener("click", () => { state.authenticated = false; saveState(); render(); });
      document.getElementById("pNameInput").addEventListener("input", (e) => { state.pName = e.target.value; });
      document.getElementById("pRoleSelect").addEventListener("change", (e) => { state.pRole = e.target.value; });
      document.getElementById("pPriceInput").addEventListener("input", (e) => { state.pPrice = e.target.value; });
      document.getElementById("pOverseasBtn").addEventListener("click", () => { state.pOverseas = !state.pOverseas; render(); });
      document.getElementById("undoBtn").addEventListener("click", () => { if (state.sales.length > 0) { state.sales.shift(); saveState(); render(); } });

      document.querySelectorAll(".quick-add-btn").forEach(btn => {
        btn.addEventListener("click", () => handleAddSale(btn.dataset.team));
      });

      document.querySelectorAll(".squad-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => { state.selectedSquadTeamId = btn.dataset.team; render(); });
      });

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          state.sales = state.sales.filter(s => s.id !== id);
          saveState();
          render();
        });
      });

      document.getElementById("aiPlayer").addEventListener("input", (e) => { state.aiTargetPlayer = e.target.value; });
      document.getElementById("aiRole").addEventListener("change", (e) => { state.aiTargetRole = e.target.value; });
      document.getElementById("aiBid").addEventListener("input", (e) => { state.aiCurrentBid = e.target.value; });
      document.getElementById("aiRival").addEventListener("change", (e) => { state.aiRivalTeam = e.target.value; });
      document.getElementById("runAiBtn").addEventListener("click", runAiAnalysis);
    }

    render();
  </script>
</body>
</html>
