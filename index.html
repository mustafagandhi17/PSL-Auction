    // --- CUSTOM DASHBOARD PASSCODE CONFIGURATION ---
    const DASHBOARD_PASSCODE = "PSL2026"; // Shared team passcode

    // --- PASSWORD GATE SCREEN COMPONENT ---
    function PasscodeScreen({ onUnlock }) {
      const [input, setInput] = useState("");
      const [error, setError] = useState(false);

      const handleCheck = (e) => {
        e.preventDefault();
        if (input.trim() === DASHBOARD_PASSCODE) {
          localStorage.setItem("psl_authenticated", "true");
          onUnlock();
        } else {
          setError(true);
        }
      };

      return (
        <div className="fixed inset-0 z-[100] bg-[#080c14] flex items-center justify-center p-4">
          <div className="bg-[#0f172a] border border-slate-800 rounded-2xl p-6 max-w-xs w-full shadow-2xl text-center">
            <div className="w-12 h-12 bg-emerald-500/20 border border-emerald-500/50 rounded-xl flex items-center justify-center text-2xl mx-auto mb-3">
              🔒
            </div>
            <h2 className="text-base font-black text-white uppercase tracking-wider mb-1">
              PSL AUCTION HUB
            </h2>
            <p className="text-xs text-slate-400 mb-4">
              Enter team passcode to view auction telemetry
            </p>
            <form onSubmit={handleCheck} className="space-y-3">
              <input
                type="password"
                placeholder="Passcode..."
                value={input}
                onChange={(e) => { setInput(e.target.value); setError(false); }}
                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-center text-sm font-bold text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
              />
              {error && (
                <p className="text-xs font-bold text-rose-400">Incorrect Passcode!</p>
              )}
              <button
                type="submit"
                className="w-full py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs uppercase tracking-wider transition shadow-lg"
              >
                Unlock Dashboard
              </button>
            </form>
          </div>
        </div>
      );
    }
