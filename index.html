      { id: 134, name: "Tabrez Shamsi", role: "Spinner", isOverseas: true, price: 2.2, teamId: "SS", timestamp: "Pick 10" },

      { id: 137, name: "Josh Philippe", role: "Wicket-keeper", isOverseas: true, price: 2.3, teamId: "SS", timestamp: "Pick 13" },
      { id: 138, name: "Shan Masood", role: "Top-Order Batter", isOverseas: false, price: 0.65, teamId: "SS", timestamp: "Pick 14" },
      { id: 139, name: "Momin Qamar", role: "Spinner", isOverseas: false, price: 1.075, teamId: "SS", timestamp: "Pick 15" },
      { id: 140, name: "Muhammad Awais Zafar", role: "Fast Bowler", isOverseas: false, price: 0.6, teamId: "SS", timestamp: "Pick 16" }
    ];

    // Helper: Calculate top priority roster gaps for a given team
    function calculatePriorityGaps(roster) {
      const wk = roster.filter(r => r.role === "Wicket-keeper").length;
      const batters = roster.filter(r => r.role === "Top-Order Batter").length;
      const allRounders = roster.filter(r => r.role === "All-Rounder").length;
      const pace = roster.filter(r => r.role === "Fast Bowler").length;
      const spin = roster.filter(r => r.role === "Spinner").length;

      const gaps = [];
      if (wk === 0) gaps.push({ text: "URGENT: Wicket-keeper", priority: 1 });
      if (pace < 3) gaps.push({ text: `Pace Bowlers (${pace}/3)`, priority: 2 });
      if (batters < 4) gaps.push({ text: `Top-Order Batters (${batters}/4)`, priority: 3 });
      if (spin < 2) gaps.push({ text: `Spinners (${spin}/2)`, priority: 4 });
      if (allRounders < 2) gaps.push({ text: `All-Rounders (${allRounders}/2)`, priority: 5 });

      if (gaps.length === 0) {
        return [{ text: "Roster Well Balanced", priority: 99 }];
      }
      return gaps.slice(0, 3);
    }

    function App() {
      const [sales, setSales] = useState(() => {
        const saved = localStorage.getItem("psl_sales_data");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length >= 100) {
              return parsed;
            }
          } catch(e) {}
        }
        return INITIAL_SALES;
      });

      const [myTeamId, setMyTeamId] = useState("ISLU");
      const [selectedSquadTeamId, setSelectedSquadTeamId] = useState("ISLU");
      const fileInputRef = useRef(null);

      // Rapid entry state
      const [pName, setPName] = useState("");
      const [pRole, setPRole] = useState("Top-Order Batter");
      const [pPrice, setPPrice] = useState("");
      const [pOverseas, setPOverseas] = useState(false);
      const [pTeam, setPTeam] = useState("ISLU");

      // AI Advisor state
      const [aiTargetPlayer, setAiTargetPlayer] = useState("");
      const [aiTargetRole, setAiTargetRole] = useState("Wicket-keeper");
      const [aiCurrentBid, setAiCurrentBid] = useState("3.5");
      const [aiRivalTeam, setAiRivalTeam] = useState("LQ");
      const [aiAdvice, setAiAdvice] = useState(null);

      // Save sales to local storage
      useEffect(() => {
        localStorage.setItem("psl_sales_data", JSON.stringify(sales));
      }, [sales]);

      // Telemetry computation for all teams
      const teamStats = useMemo(() => {
        const stats = {};
        DEFAULT_TEAMS.forEach(t => {
          stats[t.id] = {
            ...t,
            spent: 0,
            squadCount: 0,
            overseasCount: 0,
            roster: [],
            roles: { "Wicket-keeper": 0, "Top-Order Batter": 0, "All-Rounder": 0, "Fast Bowler": 0, "Spinner": 0 }
          };
        });

        sales.forEach(s => {
          if (stats[s.teamId]) {
            stats[s.teamId].spent += Number(s.price);
            stats[s.teamId].squadCount += 1;
            if (s.isOverseas) stats[s.teamId].overseasCount += 1;
            stats[s.teamId].roster.push(s);
            if (stats[s.teamId].roles[s.role] !== undefined) {
              stats[s.teamId].roles[s.role] += 1;
            }
          }
        });

        // Compute remaining purse, max bid power, and priority gaps
        Object.keys(stats).forEach(id => {
          const t = stats[id];
          t.remPurse = Math.max(0, t.purseCap - t.spent);
          const unfilledSlots = Math.max(0, 16 - t.squadCount);
          const reservedCap = unfilledSlots * 0.50; // PKR 0.50 Cr base slot reserve
          t.maxBidPower = Math.max(0, t.remPurse - reservedCap);
          t.priorityGaps = calculatePriorityGaps(t.roster);
        });

        return stats;
      }, [sales]);

      const myTeam = teamStats[myTeamId] || teamStats["ISLU"];

      // Add sales record
      const handleAddSale = (overrideTeamId) => {
        if (!pName.trim()) return;
        let parsedPrice = parseFloat(pPrice) || 0.6;
        // Normalization: If user typed 126000000 instead of 12.6 Cr
        if (parsedPrice > 1000) parsedPrice = parsedPrice / 10000000;

        const targetTeam = overrideTeamId || pTeam;
        const newSale = {
          id: Date.now(),
          name: pName.trim(),
          role: pRole,
          isOverseas: pOverseas,
          price: parsedPrice,
          teamId: targetTeam,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };

        setSales(prev => [newSale, ...prev]);
        setPName("");
        setPPrice("");
      };

      const handleUndoLast = () => {
        if (sales.length > 0) {
          setSales(prev => prev.slice(1));
        }
      };

      const handleDeleteSale = (saleId) => {
        setSales(prev => prev.filter(s => s.id !== saleId));
      };

      // Excel / XLSX Uploader handler
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

            const importedSales = [];
            json.forEach((row, idx) => {
              const name = row['Player'] || row['Player Name'] || row['Name'] || row['PLAYER'] || `Player ${idx + 1}`;
              const role = row['Role'] || row['Position'] || row['ROLE'] || "Top-Order Batter";
              const rawOverseas = String(row['Category'] || row['Overseas'] || row['Type'] || "").toLowerCase();
              const isOverseas = rawOverseas.includes("yes") || rawOverseas.includes("foreign") || rawOverseas.includes("overseas");
              let rawPrice = parseFloat(row['Price'] || row['Sold Price'] || row['Amount'] || row['PRICE'] || 0.6);
              if (rawPrice > 1000) rawPrice = rawPrice / 10000000; // Normalize PKR to Crore

              const rawTeam = String(row['Team'] || row['Franchise'] || row['Buyer'] || row['TEAM'] || "ISLU").toUpperCase();
              let matchedTeam = DEFAULT_TEAMS.find(t => t.short === rawTeam || rawTeam.includes(t.short) || t.name.toUpperCase().includes(rawTeam));
              const teamId = matchedTeam ? matchedTeam.id : "ISLU";

              importedSales.push({
                id: Date.now() + idx,
                name: String(name).trim(),
                role: String(role).trim(),
                isOverseas: isOverseas,
                price: rawPrice,
                teamId: teamId,
                timestamp: `Imported Pick ${idx + 1}`
              });
            });

            if (importedSales.length > 0) {
              setSales(importedSales);
            }
          } catch (err) {
            alert("Error parsing file. Ensure it is a valid Excel/CSV spreadsheet.");
          }
        };
        reader.readAsArrayBuffer(file);
      };

      // Run instant strategy advisor logic
      const runAiAnalysis = () => {
        const rival = teamStats[aiRivalTeam];
        const bidVal = parseFloat(aiCurrentBid) || 3.0;

        let verdict = "BID FAST";
        let color = "text-emerald-400";
        let cap = Math.min(myTeam.maxBidPower, bidVal + 2.5);
        let reasoning = "";

        if (rival.remPurse < bidVal) {
          verdict = "WALK AWAY / THEY ARE OUT";
          color = "text-cyan-400";
          reasoning = `${rival.name} has only PKR ${rival.remPurse.toFixed(2)} Cr remaining and cannot match your bid of PKR ${bidVal.toFixed(2)} Cr!`;
        } else if (rival.maxBidPower < bidVal) {
          verdict = "PUSH RIVAL TO MAX";
          color = "text-amber-400";
          reasoning = `${rival.name} max bid ceiling is PKR ${rival.maxBidPower.toFixed(2)} Cr. Bid one more tick (+0.25 Cr) to force them to forfeit.`;
        } else if (myTeam.remPurse < bidVal + 0.5) {
          verdict = "LET THEM OVERPAY";
          color = "text-rose-400";
          reasoning = `Your remaining purse (PKR ${myTeam.remPurse.toFixed(2)} Cr) is constrained. Don't engage in a bidding war here.`;
        } else {
          verdict = "BID FAST & AGGRESSIVE";
          color = "text-emerald-400";
          reasoning = `${rival.name} urgently needs a ${aiTargetRole}. Counter-bid up to PKR ${cap.toFixed(2)} Cr to secure the asset.`;
        }

        setAiAdvice({
          verdict,
          color,
          cap: cap.toFixed(2),
          rivalMaxPower: rival.maxBidPower.toFixed(2),
          rivalPurse: rival.remPurse.toFixed(2),
          reasoning
        });
      };

      return (
        <div className="min-h-screen flex flex-col pb-12">
          {/* TOP COMMAND HEADER */}
          <header className="bg-[#0b1120] border-b border-slate-800 sticky top-0 z-50 px-3 sm:px-4 py-2.5 sm:py-3 shadow-xl">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 sm:gap-3">
              <div className="flex items-center space-x-2.5 sm:space-x-3">
                <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center font-black text-emerald-400 text-base sm:text-lg shrink-0">
                  ⚡
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-1.5 sm:gap-2">
                    PSL AUCTION COMMAND CENTER
                    <span className="text-[10px] sm:text-xs font-semibold px-1.5 sm:px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">LIVE</span>
                  </h1>
                  <p className="text-[10px] sm:text-xs text-slate-400">100ms Scannable Intelligence & Bid Power Analyzer</p>
                </div>
              </div>

              {/* MY TEAM FRANCHISE SELECTOR & EXCEL UPLOADER */}
              <div className="flex items-center justify-between sm:justify-end gap-2 sm:gap-3 w-full sm:w-auto pt-1 sm:pt-0 border-t sm:border-t-0 border-slate-800">
                <div className="flex items-center gap-1.5 sm:gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1 flex-1 sm:flex-none">
                  <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase shrink-0">My Team:</span>
                  <select

                    onChange={(e) => setMyTeamId(e.target.value)}

                    {DEFAULT_TEAMS.map(t => (
                      <option key={t.id} value={t.id} className="bg-slate-900 text-white">

                  📊 Import Excel
                </button>
              </div>
            </div>

              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2">

                  value={pName}
                  onChange={(e) => setPName(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleAddSale()}
                  className="lg:col-span-3 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-white placeholder-slate-500 font-semibold focus:outline-none focus:border-emerald-500"
                />

                <select

                  onChange={(e) => setPRole(e.target.value)}

                  <option value="Top-Order Batter">Top-Order Batter</option>
                  <option value="Wicket-keeper">Wicket-keeper</option>
                  <option value="All-Rounder">All-Rounder</option>
                  <option value="Fast Bowler">Fast Bowler</option>

                <div className="grid grid-cols-2 gap-2 lg:col-span-4">
                  <input

                  <button

                  <div className="grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-4 gap-1 w-full">
                    {DEFAULT_TEAMS.map(t => (
                      <button

                        onClick={() => handleAddSale(t.id)}

            {/* MY TEAM SPLIT-SECOND HUD */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-3">

                <div className="text-xl sm:text-3xl font-black text-emerald-400 mono mt-0.5 sm:mt-1">
                  PKR {myTeam.remPurse.toFixed(2)} <span className="text-xs sm:text-sm text-emerald-500 font-bold">Cr</span>
                </div>
                <div className="text-[10px] sm:text-[11px] text-slate-400 mt-1 flex flex-col sm:flex-row justify-between">
                  <span>Spent: {myTeam.spent.toFixed(2)} Cr</span>
                  <span>Cap: {myTeam.purseCap.toFixed(1)} Cr</span>
                </div>
              </div>

              <div className="command-card rounded-xl p-3 sm:p-4 border-l-4 border-l-cyan-500">
                <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider block">Max Bidding Power</span>
                <div className="text-xl sm:text-3xl font-black text-cyan-400 mono mt-0.5 sm:mt-1">
                  PKR {myTeam.maxBidPower.toFixed(2)} <span className="text-xs sm:text-sm text-cyan-500 font-bold">Cr</span>
                </div>
                <div className="text-[10px] sm:text-[11px] text-slate-400 mt-1">
                  Slot Reserve: PKR {((Math.max(0, 16 - myTeam.squadCount)) * 0.50).toFixed(2)} Cr

              <div className="command-card rounded-xl p-3 sm:p-4 border-l-4 border-l-amber-500">
                <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider block">Squad Capacity</span>
                <div className="text-xl sm:text-3xl font-black text-amber-400 mono mt-0.5 sm:mt-1">

                <div className="text-[10px] sm:text-[11px] text-slate-400 mt-1">

                      {myTeam.roles["Wicket-keeper"]}
                    </span>

                  <div className="flex justify-between border-b border-slate-800 pb-0.5">
                    <span className="text-slate-400">Bat:</span>
                    <span className="text-white">{myTeam.roles["Top-Order Batter"]}</span>
                  </div>
                  <div className="flex justify-between border-b border-slate-800 pb-0.5">
                    <span className="text-slate-400">AR:</span>
                    <span className="text-white">{myTeam.roles["All-Rounder"]}</span>
                  </div>
                  <div className="flex justify-between border-b border-slate-800 pb-0.5">
                    <span className="text-slate-400">Pace:</span>
                    <span className="text-white">{myTeam.roles["Fast Bowler"]}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* ALL 8 TEAMS RIVAL THREAT & GAP MATRIX */}
            <div className="command-card rounded-xl p-3 sm:p-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-3 border-b border-slate-800 pb-2 gap-1">
                <h2 className="text-xs sm:text-sm font-black uppercase text-white flex items-center gap-1.5">
                  <span>🎯</span> Rival Threat & Priority Gap Matrix (8 Teams)
                </h2>
                <span className="text-[10px] sm:text-xs text-slate-400">Max Bid = Purse - Slot Reserve</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-3">
                {DEFAULT_TEAMS.map(t => {
                  const stat = teamStats[t.id];
                  const isMyFranchise = t.id === myTeamId;

                  return (
                    <div
                      key={t.id}
                      className={`rounded-lg p-2.5 sm:p-3 border transition ${
                        isMyFranchise
                          ? "bg-emerald-950/20 border-emerald-500/60 ring-1 ring-emerald-500/30"
                          : "bg-slate-900/80 border-slate-800"
                      }`}
                    >
                      <div className="flex items-center justify-between mb-2">
                        <span className={`text-[11px] sm:text-xs font-black px-2 py-0.5 rounded border ${t.bgClass}`}>
                          {t.name} ({t.short})

                        {isMyFranchise && (

                      </div>

                      <div className="grid grid-cols-2 gap-2 text-xs mb-2">

                          <span className="font-black text-cyan-400 mono text-xs sm:text-sm">PKR {stat.maxBidPower.toFixed(2)} Cr</span>
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-[11px] sm:text-xs text-slate-400 mb-2 px-0.5">
                        <span>Squad: <strong className="text-white">{stat.squadCount}/20</strong></span>
                        <span>Overseas: <strong className="text-amber-300">{stat.overseasCount}/6 ✈️</strong></span>

                      <div className="space-y-1 pt-1 border-t border-slate-800">
                        <span className="text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">Priority Gaps:</span>

                            }`}
                          >
                            <span>#{gIdx + 1} {gap.text}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* INSTANT GEMINI AI BIDDING ADVISOR */}
            <div className="command-card rounded-xl p-3 sm:p-4 border-l-4 border-l-cyan-500">
              <div className="flex items-center justify-between mb-2.5 sm:mb-3 border-b border-slate-800 pb-2">
                <div>
                  <h2 className="text-xs sm:text-sm font-black uppercase text-white flex items-center gap-1.5">
                    <span>🤖</span> Gemini AI Live Bidding Strategy Advisor
                  </h2>
                  <p className="text-[10px] sm:text-xs text-slate-400">Evaluates target role, live rival max bid power, and recommends split-second counter action.</p>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5 sm:gap-3">
                <input
                  type="text"
                  placeholder="Target Player Name"
                  value={aiTargetPlayer}
                  onChange={(e) => setAiTargetPlayer(e.target.value)}
                  className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 font-semibold focus:outline-none focus:border-cyan-500"
                />

                <select
                  value={aiTargetRole}
                  onChange={(e) => setAiTargetRole(e.target.value)}
                  className="bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-xs font-bold text-slate-200 focus:outline-none focus:border-cyan-500"
                >
                  <option value="Wicket-keeper">Wicket-keeper</option>
                  <option value="Top-Order Batter">Top-Order Batter</option>
                  <option value="All-Rounder">All-Rounder</option>
                  <option value="Fast Bowler">Fast Bowler</option>
                  <option value="Spinner">Spinner</option>
                </select>

                <input
                  type="number"
                  step="0.25"
                  placeholder="Active Bid (PKR Cr)"
                  value={aiCurrentBid}
                  onChange={(e) => setAiCurrentBid(e.target.value)}
                  className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 mono font-bold focus:outline-none focus:border-cyan-500"
                />

                <select
                  value={aiRivalTeam}
                  onChange={(e) => setAiRivalTeam(e.target.value)}
                  className="bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-xs font-bold text-amber-300 focus:outline-none focus:border-cyan-500"
                >
                  {DEFAULT_TEAMS.filter(t => t.id !== myTeamId).map(t => (
                    <option key={t.id} value={t.id} className="bg-slate-900 text-white">
                      Rival: {t.name} ({t.short})
                    </option>
                  ))}
                </select>

                <button
                  onClick={runAiAnalysis}
                  className="bg-cyan-600 hover:bg-cyan-500 text-black font-black text-xs rounded-lg px-3 py-2 transition shadow-md uppercase active:scale-95 sm:col-span-2 lg:col-span-1"
                >
                  ⚡ Run AI Telemetry
                </button>
              </div>

              {aiAdvice && (
                <div className="mt-3 bg-slate-950 border border-cyan-500/40 rounded-xl p-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                  <div>
                    <span className="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Recommended Action:</span>
                    <span className={`text-base sm:text-lg font-black tracking-wide ${aiAdvice.color}`}>
                      {aiAdvice.verdict}
                    </span>
                    <p className="text-xs text-slate-300 mt-0.5">{aiAdvice.reasoning}</p>
                  </div>
                  <div className="flex gap-4 border-t sm:border-t-0 sm:border-l border-slate-800 pt-2 sm:pt-0 sm:pl-4 text-xs w-full sm:w-auto justify-between sm:justify-start">
                    <div>
                      <span className="text-[9px] sm:text-[10px] text-slate-500 block uppercase">Target Bid Cap</span>
                      <span className="font-extrabold text-emerald-400 mono">PKR {aiAdvice.cap} Cr</span>
                    </div>
                    <div>
                      <span className="text-[9px] sm:text-[10px] text-slate-500 block uppercase">Rival Purse Power</span>
                      <span className="font-extrabold text-amber-400 mono">PKR {aiAdvice.rivalPurse} Cr</span>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* ALL 8 FRANCHISES LIVE SQUAD INSPECTOR */}
            <div className="command-card rounded-xl p-3 sm:p-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3 border-b border-slate-800 pb-2">
                <div>
                  <h2 className="text-xs sm:text-sm font-black uppercase text-white flex items-center gap-1.5">
                    <span>📋</span> All 8 Franchises Live Squad Roster Inspector
                  </h2>
                  <p className="text-[10px] sm:text-xs text-slate-400">Inspect real-time player listings, contract prices, and category compositions from your spreadsheet.</p>
                </div>

                <div className="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
                  {DEFAULT_TEAMS.map(t => (
                    <button
                      key={t.id}
                      onClick={() => setSelectedSquadTeamId(t.id)}
                      className={`px-2.5 py-1 rounded text-[11px] sm:text-xs font-extrabold transition shrink-0 ${
                        selectedSquadTeamId === t.id
                          ? "bg-emerald-500 text-black shadow-md"
                          : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                      }`}
                    >
                      {t.short} ({teamStats[t.id].squadCount})
                    </button>
                  ))}
                </div>
              </div>

              {/* SQUAD ROSTER TABLE */}
              <div className="bg-slate-950 border border-slate-800 rounded-lg overflow-x-auto">
                <div className="p-2.5 sm:p-3 bg-slate-900 flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-800 gap-1">
                  <span className="text-[11px] sm:text-xs font-black text-emerald-400 uppercase">
                    {teamStats[selectedSquadTeamId].name} Full Squad Roster ({teamStats[selectedSquadTeamId].squadCount} Players)
                  </span>
                  <span className="text-[11px] sm:text-xs font-bold text-slate-400">
                    Total Spent: PKR {teamStats[selectedSquadTeamId].spent.toFixed(2)} Cr
                  </span>
                </div>

                <table className="w-full text-left border-collapse text-xs min-w-[500px]">
                  <thead>
                    <tr className="bg-slate-900/60 text-slate-400 border-b border-slate-800 font-bold uppercase text-[10px] sm:text-xs">
                      <th className="p-2 sm:p-2.5">#</th>
                      <th className="p-2 sm:p-2.5">Player Name</th>
                      <th className="p-2 sm:p-2.5">Role</th>
                      <th className="p-2 sm:p-2.5">Category</th>
                      <th className="p-2 sm:p-2.5 text-right">Contract Price</th>
                      <th className="p-2 sm:p-2.5 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {teamStats[selectedSquadTeamId].roster.length === 0 ? (
                      <tr>
                        <td colSpan="6" className="p-4 text-center text-slate-500 font-semibold">
                          No players signed in this franchise squad yet.
                        </td>
                      </tr>
                    ) : (
                      teamStats[selectedSquadTeamId].roster.map((player, idx) => (
                        <tr key={player.id} className="border-b border-slate-800/60 hover:bg-slate-900/40 font-medium text-slate-200">
                          <td className="p-2 sm:p-2.5 text-slate-500 mono">{idx + 1}</td>
                          <td className="p-2 sm:p-2.5 font-bold text-white flex items-center gap-1.5">
                            {player.name}
                            {player.isOverseas && <span className="text-[9px] sm:text-[10px] text-amber-300 bg-amber-500/10 px-1 py-0.5 rounded border border-amber-500/30">✈️ Foreign</span>}
                          </td>
                          <td className="p-2 sm:p-2.5 text-slate-400 text-[11px] sm:text-xs">{player.role}</td>
                          <td className="p-2 sm:p-2.5">
                            <span className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 text-[9px] sm:text-[10px] font-bold border border-slate-700">
                              {player.isOverseas ? "Overseas" : "Local"}
                            </span>
                          </td>
                          <td className="p-2 sm:p-2.5 text-right font-black text-emerald-400 mono">
                            PKR {player.price.toFixed(2)} Cr
                          </td>
                          <td className="p-2 sm:p-2.5 text-center">
                            <button
                              onClick={() => handleDeleteSale(player.id)}
                              className="text-rose-400 hover:text-rose-300 font-bold px-1.5 py-0.5 rounded bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-[10px] sm:text-xs"
                            >
                              ✕
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // Render App Component safely
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
